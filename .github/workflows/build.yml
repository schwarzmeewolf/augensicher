name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        shell: powershell
        run: .\tools\build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: Augensicher-windows
          path: dist/*.zip
